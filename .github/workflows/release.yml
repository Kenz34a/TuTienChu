name: Build Windows and Android release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching package.json (for example v1.6.1)
        required: true
        default: v1.6.1
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: game_test
          POSTGRES_PASSWORD: local-ci-test-password
          POSTGRES_DB: game_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U game_test -d game_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      TEST_DATABASE_URL: postgresql://game_test:local-ci-test-password@127.0.0.1:5432/game_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const version=JSON.parse(readFileSync("package.json","utf8")).version; if(process.env.RELEASE_TAG!==`v${version}`) throw new Error("Release tag must match package.json version");'
      - name: Prepare Android SDK
        run: |
          ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm ci
      - name: Build web and server
        run: npm run build:all
      - name: Test game and accounts on SQLite and PostgreSQL
        run: npm test
      - name: Build Windows app
        run: npm run pc:build
      - name: Build and verify Android APK
        run: npm run android:build
      - name: Package web server and checksums
        run: |
          python3 scripts/package-release.py
          cd release
          sha256sum -c SHA256SUMS.txt
      - name: Attach packages and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          RELEASE_NOTES="docs/release-${RELEASE_TAG#v}.md"
          test -f "$RELEASE_NOTES"
          if gh release view "$RELEASE_TAG" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
            gh release edit "$RELEASE_TAG" --target "$GITHUB_SHA" --notes-file "$RELEASE_NOTES"
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Vân Tiên Ký $RELEASE_TAG — Windows, Android và web" --notes-file "$RELEASE_NOTES" --draft
          fi
          gh release upload "$RELEASE_TAG" release/van-tien-ky-pc-windows.zip release/van-tien-ky-android.apk release/van-tien-ky-web-server.zip release/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
