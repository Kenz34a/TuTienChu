name: Test SQLite and PostgreSQL

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: game_test
          POSTGRES_PASSWORD: local-ci-test-password
          POSTGRES_DB: game_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U game_test -d game_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      TEST_DATABASE_URL: postgresql://game_test:local-ci-test-password@127.0.0.1:5432/game_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:all
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e -- --workers=2
